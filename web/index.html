<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bush Master of SPLORR!!</title>
<style>
	html, body { margin: 0; height: 100%; background: #1a1c2c; color: #94b0c2; overflow: hidden; }
	body { display: flex; flex-direction: column; align-items: center; justify-content: center; font: 12px monospace; }
	canvas {
		image-rendering: pixelated;
		width: min(100vw, calc((100vh - 40px) * 384 / 216));
		height: min(calc(100vh - 40px), calc(100vw * 216 / 384));
		touch-action: none;
	}
	footer { margin-top: 4px; text-align: center; max-width: 96vw; line-height: 1.3; }
	footer a { color: #aaa; }
	/* Touch controls: shown once the page sees a touch. */
	.pad { position: fixed; bottom: 48px; display: none; gap: 4px; z-index: 2; }
	.pad.on { display: grid; }
	#dpad { left: 8px; grid-template-columns: repeat(3, 44px); }
	#acts { right: 8px; grid-template-columns: 56px; }
	.pad button {
		height: 44px; font: bold 14px monospace; color: #f4f4f4; background: rgba(51, 60, 87, 0.55);
		border: 1px solid rgba(148, 176, 194, 0.6); border-radius: 6px; touch-action: none; user-select: none;
		-webkit-user-select: none; padding: 0;
	}
	.pad button:active { background: rgba(65, 166, 246, 0.6); }
	.pad span { display: block; }
	@media (max-height: 500px) {
		footer { font-size: 8px; margin-top: 2px; line-height: 1.2; }
		canvas { width: min(calc(100vw - 216px), calc((100vh - 24px) * 384 / 216)); height: min(calc(100vh - 24px), calc((100vw - 216px) * 216 / 384)); }
		.pad { bottom: 30px; gap: 2px; }
		#dpad { left: 2px; grid-template-columns: repeat(3, 32px); }
		#acts { right: 2px; grid-template-columns: 48px; }
		.pad button { height: 32px; font-size: 12px; }
	}
</style>
</head>
<body>
<canvas id="screen" width="384" height="216"></canvas>
<div id="dpad" class="pad">
	<span></span><button data-c="0">&#8593;</button><span></span>
	<button data-c="2">&#8592;</button><span></span><button data-c="3">&#8594;</button>
	<span></span><button data-c="1">&#8595;</button><span></span>
</div>
<div id="acts" class="pad">
	<button data-c="4">OK</button><button data-c="5">Back</button>
</div>
<footer>
	Bush Master of SPLORR!! by TheGrumpyGameDev. Code made by an AI agent (Claude Code) at the author's direction.
	Tiles: Urizen by vurmux (CC0). Font: DINOBYTE by mby (CC BY 4.0). Feedback by LootLocker.
	<a href="#" id="feedback-link">Send feedback (F)</a> · <a href="#" id="restart-link">Start over</a> · <a href="https://thegrumpygamedev.itch.io/">itch.io</a> · <a href="https://playdeezgames.github.io/oeuvre-of-splorr/">more games</a>
</footer>
<script src="odin.js"></script>
<script src="lootlocker.js"></script>
<script>
(async function () {
	const canvas = document.getElementById("screen");
	const ctx = canvas.getContext("2d");

	// Feedback through the shared SPLORR!! LootLocker kit. The LootLocker game for this Metaphor is not set up
	// yet (the user's console setup: Guest Login, CORS Allowlist, a Game feedback category); until domain and
	// key are filled in, the form opens but cannot send.
	const ll = LootLocker({ domain: "", key: "", version: "0.0.1", idKey: "bmos-ll-player" });
	const feedback = ll.feedbackDialog({ game: "Bush Master of SPLORR!!" });
	document.getElementById("feedback-link").addEventListener("click", (e) => { e.preventDefault(); feedback.open(); });

	const memory = new odin.WasmMemoryInterface();
	await odin.runWasm("game.wasm", null, {}, memory);
	const ex = memory.exports;
	const W = ex.platform_screen_w(), H = ex.platform_screen_h();

	// The plot is saved in localStorage every few seconds and when the page is hidden; a save this
	// build cannot read, or none, starts a fresh plot. "Start over" forgets it.
	const SAVE_KEY = "bush-master-save";
	function store(fn) { try { return fn(); } catch (e) { return null; } }
	const saved = store(() => localStorage.getItem(SAVE_KEY));
	if (saved) {
		store(() => {
			const bin = atob(saved);
			if (bin.length > ex.platform_save_cap()) return;
			const buf = new Uint8Array(memory.memory.buffer, ex.platform_load_ptr(), bin.length);
			for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
			ex.platform_load(bin.length);
		});
	}
	function saveNow() {
		store(() => {
			const n = ex.platform_save();
			if (n <= 0) return;
			const bytes = new Uint8Array(memory.memory.buffer, ex.platform_save_ptr(), n);
			let s = "";
			for (let i = 0; i < n; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
			localStorage.setItem(SAVE_KEY, btoa(s));
		});
	}
	setInterval(saveNow, 3000);
	document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(); });
	window.addEventListener("pagehide", saveNow);
	document.getElementById("restart-link").addEventListener("click", (e) => {
		e.preventDefault();
		if (!confirm("Start over with a fresh plot? Yer jools are forgotten.")) return;
		ex.platform_restart();
		store(() => localStorage.removeItem(SAVE_KEY));
	});

	// Sound effects: small synthesised blips, one entry per game.Sound (src/game/sound.odin), in that
	// order. Each is a list of notes [start Hz, end Hz, ms, wave, volume] played one after another.
	// The game decides what plays and handles mute (Esc menu); the page only plays the queue.
	const SOUNDS = [
		[[880, 1320, 50, "square", 0.10]],                                         // Pick
		[[660, 660, 50, "square", 0.10], [990, 990, 80, "square", 0.10]],          // Sell
		[[220, 180, 90, "square", 0.08]],                                          // Full
		[[330, 160, 220, "triangle", 0.18]],                                       // Tired
		[[523, 523, 60, "square", 0.09], [659, 659, 60, "square", 0.09], [784, 784, 100, "square", 0.09]], // Buy
		[[140, 110, 140, "sawtooth", 0.07]],                                       // Deny
		[[1200, 1200, 20, "square", 0.04]],                                        // Move
		[[600, 900, 60, "triangle", 0.12]],                                        // Open
		[[900, 600, 60, "triangle", 0.12]],                                        // Close
		[[392, 392, 160, "triangle", 0.15], [330, 330, 160, "triangle", 0.15], [262, 262, 320, "triangle", 0.15]], // Sleep
		[[1046, 1046, 40, "square", 0.08], [1318, 1318, 70, "square", 0.08]],      // Pay
		[[523, 523, 120, "square", 0.10], [659, 659, 120, "square", 0.10], [784, 784, 120, "square", 0.10], [1046, 1046, 360, "square", 0.10]], // Paid_Off
		[[1400, 1800, 30, "square", 0.03]],                                        // Robot_Pick
		[[700, 700, 40, "square", 0.04], [1050, 1050, 50, "square", 0.04]],        // Robot_Sell
		[[400, 80, 400, "sawtooth", 0.10]],                                        // Reset
	];
	let audio = null;
	function unlockAudio() {
		if (audio) { if (audio.state === "suspended") audio.resume(); return; }
		const AC = window.AudioContext || window.webkitAudioContext;
		if (AC) audio = new AC();
	}
	window.addEventListener("keydown", unlockAudio);
	window.addEventListener("pointerdown", unlockAudio);
	function playSound(id) {
		const notes = SOUNDS[id];
		if (!audio || !notes || audio.state !== "running") return;
		let t = audio.currentTime + 0.005;
		for (const [f0, f1, ms, type, vol] of notes) {
			const osc = audio.createOscillator(), gain = audio.createGain(), end = t + ms / 1000;
			osc.type = type;
			osc.frequency.setValueAtTime(f0, t);
			osc.frequency.linearRampToValueAtTime(f1, end);
			gain.gain.setValueAtTime(vol, t);
			gain.gain.exponentialRampToValueAtTime(0.0001, end);
			osc.connect(gain).connect(audio.destination);
			osc.start(t);
			osc.stop(end + 0.01);
			t = end;
		}
	}
	function drainSounds() {
		const n = ex.platform_sound_count();
		const seen = new Set();
		for (let i = 0; i < n; i++) {
			const id = ex.platform_sound(i);
			if (!seen.has(id)) playSound(id); // one of each a frame: robots stay polite
			seen.add(id);
		}
		if (n > 0) ex.platform_sounds_clear();
	}

	// game.Command order (src/game/game.odin): North South West East Act Cancel. The controls are only
	// these six (the user's rule): arrows or WASD, Space for OK, Esc to cancel.
	const C = { N: 0, S: 1, W: 2, E: 3, OK: 4, CANCEL: 5 };
	const KEYS = {
		ArrowUp: C.N, ArrowDown: C.S, ArrowLeft: C.W, ArrowRight: C.E,
		KeyW: C.N, KeyS: C.S, KeyA: C.W, KeyD: C.E,
		Space: C.OK, Escape: C.CANCEL,
	};
	window.addEventListener("keydown", (e) => {
		if (e.code === "KeyF" && !e.repeat) { e.preventDefault(); feedback.open(); return; }
		if (!(e.code in KEYS)) return;
		e.preventDefault();
		if (e.repeat && KEYS[e.code] === C.CANCEL) return;
		ex.platform_command(KEYS[e.code]);
	});

	// Touch: the pads (directions, OK, Back) appear on the first touch; the screen itself takes no clicks.
	canvas.addEventListener("contextmenu", (e) => e.preventDefault());
	canvas.addEventListener("pointerdown", (e) => { if (e.pointerType === "touch" || e.pointerType === "pen") showPads(); });

	// Touch pads. Held buttons repeat like held keys.
	const pads = document.querySelectorAll(".pad");
	function showPads() { pads.forEach((p) => p.classList.add("on")); }
	if (window.matchMedia && matchMedia("(pointer: coarse)").matches) showPads();
	window.addEventListener("touchstart", showPads, { once: true, passive: true });
	let padHeld = null;
	document.querySelectorAll(".pad button").forEach((b) => {
		const c = Number(b.dataset.c);
		b.addEventListener("pointerdown", (e) => {
			e.preventDefault();
			ex.platform_command(c);
			clearInterval(padHeld);
			if (c === C.CANCEL) return;
			const started = Date.now();
			padHeld = setInterval(() => { if (Date.now() - started > 300) ex.platform_command(c); }, 110);
		});
		const release = () => { clearInterval(padHeld); padHeld = null; };
		b.addEventListener("pointerup", release);
		b.addEventListener("pointercancel", release);
		b.addEventListener("pointerleave", release);
		b.addEventListener("contextmenu", (e) => e.preventDefault());
	});

	// Gamepad (standard mapping): d-pad or left stick for the directions, A for OK, B to cancel.
	// Held directions repeat after 12 frames, then every 6.
	const pad = { held: -1, frames: 0, buttons: [] };
	function stickCommand(gp) {
		const b = (i) => gp.buttons[i] && gp.buttons[i].pressed;
		if (b(12)) return C.N; if (b(13)) return C.S; if (b(14)) return C.W; if (b(15)) return C.E;
		if (gp.axes.length >= 2) {
			const ax = gp.axes[0], ay = gp.axes[1];
			if (Math.hypot(ax, ay) > 0.5) return Math.abs(ax) > Math.abs(ay) ? (ax > 0 ? C.E : C.W) : (ay > 0 ? C.S : C.N);
		}
		return -1;
	}
	function pollPad() {
		const gp = navigator.getGamepads ? Array.from(navigator.getGamepads()).find((g) => g) : null;
		if (!gp) return;
		const d = stickCommand(gp);
		if (d !== pad.held) { pad.held = d; pad.frames = 0; if (d >= 0) ex.platform_command(d); }
		else if (d >= 0 && ++pad.frames >= 12) { pad.frames = 6; ex.platform_command(d); }
		[[0, C.OK], [1, C.CANCEL]].forEach(([i, c]) => {
			const now = !!(gp.buttons[i] && gp.buttons[i].pressed);
			if (now && !pad.buttons[i]) { unlockAudio(); ex.platform_command(c); }
			pad.buttons[i] = now;
		});
	}

	// odin.js runs the game's step; this loop polls the gamepad and copies new frames.
	const image = ctx.createImageData(W, H);
	function frame() {
		pollPad();
		drainSounds();
		if (ex.platform_frame_ready()) {
			// Read the buffer after the call: wasm memory may have grown.
			image.data.set(new Uint8Array(memory.memory.buffer, ex.platform_frame_ptr(), W * H * 4));
			ctx.putImageData(image, 0, 0);
		}
		requestAnimationFrame(frame);
	}
	requestAnimationFrame(frame);
})();
</script>
</body>
</html>
